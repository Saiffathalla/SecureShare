/* === frontend/css/styles.css === */
/* ================================================================
   SecureShare — Global Styles
   File: frontend/css/styles.css
   ================================================================ */

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #030d1a;
  --bg2:      #061525;
  --bg3:      #071e33;
  --bg4:      #0a2540;
  --blue:     #1a6cf6;
  --blue2:    #2879ff;
  --blue3:    #3d8bff;
  --cyan:     #00c6ff;
  --white:    #fff;
  --white80:  rgba(255,255,255,.8);
  --white60:  rgba(255,255,255,.6);
  --white40:  rgba(255,255,255,.4);
  --white20:  rgba(255,255,255,.2);
  --white10:  rgba(255,255,255,.1);
  --white05:  rgba(255,255,255,.05);
  --success:  #10d48e;
  --warning:  #f59e0b;
  --danger:   #f43f5e;
  --border:   rgba(255,255,255,.1);
  --border2:  rgba(255,255,255,.15);
  --card:     rgba(255,255,255,.04);
  --card2:    rgba(255,255,255,.07);
  --radius:   12px;
  --radius2:  16px;
  --radius3:  20px;
  --font:     'Plus Jakarta Sans', sans-serif;
  --mono:     'JetBrains Mono', monospace;
  --sidebar:  240px;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--white);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Animated Background Canvas ── */
#bg-canvas {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0; pointer-events: none;
}

.app { position: relative; z-index: 1; display: flex; min-height: 100vh; }

/* ================================================================
   AUTH SCREEN
   ================================================================ */
.auth-screen {
  width: 100%; display: flex; align-items: center;
  justify-content: center; min-height: 100vh; padding: 2rem;
}
.auth-card {
  background: rgba(6,21,37,.92);
  border: 1px solid var(--border2);
  border-radius: var(--radius3);
  padding: 3rem 2.5rem;
  width: 100%; max-width: 440px;
  backdrop-filter: blur(24px);
}
.auth-logo {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 2rem; justify-content: center;
}
.auth-logo .logo-icon {
  width: 44px; height: 44px;
  background: linear-gradient(135deg,#1a6cf6,#00c6ff);
  border-radius: 12px; display: flex; align-items: center; justify-content: center;
}
.auth-logo .logo-icon svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 2; }
.auth-logo span { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
.auth-logo span em { color: var(--cyan); font-style: normal; }
.auth-title { font-size: 26px; font-weight: 700; margin-bottom: .5rem; text-align: center; }
.auth-sub { color: var(--white60); font-size: 14px; text-align: center; margin-bottom: 2rem; }

/* Tabs inside auth (Login / Register / Subscription) */
.auth-tabs { display: flex; gap: .4rem; margin-bottom: 1.5rem; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 4px; }
.auth-tab { flex: 1; padding: .45rem; text-align: center; border-radius: 7px; font-size: 12.5px; font-weight: 500; cursor: pointer; color: var(--white60); transition: .15s; }
.auth-tab.active { background: rgba(26,108,246,.22); color: var(--blue3); font-weight: 600; }
.auth-tab:hover:not(.active) { color: var(--white); background: var(--white05); }

/* ================================================================
   FORMS
   ================================================================ */
.form-group { margin-bottom: 1.25rem; }
.form-label { display: block; font-size: 13px; font-weight: 500; color: var(--white80); margin-bottom: .5rem; }
.form-input {
  width: 100%; background: rgba(255,255,255,.06);
  border: 1px solid var(--border); border-radius: 10px;
  padding: .75rem 1rem; color: var(--white);
  font-family: var(--font); font-size: 14px; outline: none; transition: .2s;
}
.form-input:focus { border-color: var(--blue); background: rgba(26,108,246,.08); }
.form-input::placeholder { color: var(--white40); }

/* ================================================================
   BUTTONS
   ================================================================ */
.btn-primary {
  width: 100%; background: linear-gradient(135deg,#1a6cf6,#0099e6);
  border: none; border-radius: 10px; padding: .85rem;
  color: #fff; font-family: var(--font); font-size: 15px; font-weight: 600;
  cursor: pointer; transition: .2s; position: relative; overflow: hidden;
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 32px rgba(26,108,246,.4); }
.btn-primary:active { transform: translateY(0); }

.btn {
  display: inline-flex; align-items: center; gap: .5rem;
  padding: .6rem 1.25rem; border-radius: 10px;
  font-family: var(--font); font-size: 13.5px; font-weight: 600;
  cursor: pointer; border: none; transition: .18s;
}
.btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; }
.btn-blue { background: linear-gradient(135deg,#1a6cf6,#0099e6); color: #fff; }
.btn-blue:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(26,108,246,.4); }
.btn-ghost { background: var(--card); border: 1px solid var(--border); color: var(--white80); }
.btn-ghost:hover { background: var(--card2); border-color: var(--border2); }
.btn-danger { background: rgba(244,63,94,.15); border: 1px solid rgba(244,63,94,.3); color: var(--danger); }
.btn-danger:hover { background: rgba(244,63,94,.25); }
.btn-success { background: rgba(16,212,142,.15); border: 1px solid rgba(16,212,142,.3); color: var(--success); }
.btn-sm { padding: .4rem .9rem; font-size: 12px; }

/* ================================================================
   SIDEBAR
   ================================================================ */
.sidebar {
  width: var(--sidebar); min-height: 100vh;
  background: rgba(6,21,37,.95); border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: fixed; left: 0; top: 0; z-index: 100;
  backdrop-filter: blur(20px);
}
.sidebar-logo {
  padding: 1.5rem 1.25rem; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.s-logo-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg,#1a6cf6,#00c6ff);
  border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.s-logo-icon svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2.2; }
.sidebar-logo span { font-size: 17px; font-weight: 800; letter-spacing: -.4px; }
.sidebar-logo span em { color: var(--cyan); font-style: normal; }
.sidebar-nav { flex: 1; padding: 1rem .75rem; display: flex; flex-direction: column; gap: 4px; }
.nav-section {
  font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
  color: var(--white40); text-transform: uppercase;
  padding: .75rem .5rem .25rem; margin-top: .75rem;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: .65rem .75rem; border-radius: 10px;
  cursor: pointer; font-size: 13.5px; font-weight: 500;
  color: var(--white60); transition: .15s; position: relative;
}
.nav-item:hover { background: var(--white05); color: var(--white); }
.nav-item.active {
  background: rgba(26,108,246,.18); color: var(--blue3);
  border: 1px solid rgba(26,108,246,.25);
}
.nav-item svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; flex-shrink: 0; }
.nav-badge {
  margin-left: auto; background: var(--blue); color: #fff;
  font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px;
}
.sidebar-footer { padding: 1rem .75rem; border-top: 1px solid var(--border); }
.user-chip {
  display: flex; align-items: center; gap: 10px;
  padding: .6rem .75rem; border-radius: 10px; cursor: pointer; transition: .15s;
}
.user-chip:hover { background: var(--white05); }
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg,#1a6cf6,#00c6ff);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; flex-shrink: 0;
}
.user-info { flex: 1; min-width: 0; }
.user-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-role { font-size: 11px; color: var(--white40); margin-top: 1px; }
.logout-btn { color: var(--white40); cursor: pointer; transition: .15s; }
.logout-btn:hover { color: var(--danger); }
.logout-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }

/* ================================================================
   MAIN CONTENT
   ================================================================ */
.main { margin-left: var(--sidebar); flex: 1; padding: 2rem; overflow-y: auto; }
.page-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem;
}
.page-title { font-size: 24px; font-weight: 800; letter-spacing: -.5px; }
.page-sub { font-size: 14px; color: var(--white60); margin-top: 2px; }
.header-actions { display: flex; gap: .75rem; align-items: center; }

/* ================================================================
   KPI CARDS
   ================================================================ */
.kpi-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 1rem; margin-bottom: 2rem; }
.kpi-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius2); padding: 1.25rem;
  position: relative; overflow: hidden; transition: .2s;
}
.kpi-card:hover { border-color: var(--border2); background: var(--card2); }
.kpi-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  border-radius: var(--radius2) var(--radius2) 0 0;
}
.kpi-card.blue::before  { background: linear-gradient(90deg,#1a6cf6,#00c6ff); }
.kpi-card.green::before { background: linear-gradient(90deg,#10d48e,#05f0a3); }
.kpi-card.yellow::before{ background: linear-gradient(90deg,#f59e0b,#fcd34d); }
.kpi-card.red::before   { background: linear-gradient(90deg,#f43f5e,#fb7185); }
.kpi-label { font-size: 12px; font-weight: 500; color: var(--white60); text-transform: uppercase; letter-spacing: .8px; margin-bottom: .5rem; }
.kpi-value { font-size: 32px; font-weight: 800; letter-spacing: -1px; margin-bottom: .25rem; }
.kpi-change { font-size: 12px; font-weight: 500; }
.kpi-change.up   { color: var(--success); }
.kpi-change.down { color: var(--danger); }
.kpi-icon {
  position: absolute; right: 1.25rem; top: 1.25rem;
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
}
.kpi-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
.kpi-card.blue   .kpi-icon { background: rgba(26,108,246,.15);  color: var(--blue3); }
.kpi-card.green  .kpi-icon { background: rgba(16,212,142,.15);  color: var(--success); }
.kpi-card.yellow .kpi-icon { background: rgba(245,158,11,.15);  color: var(--warning); }
.kpi-card.red    .kpi-icon { background: rgba(244,63,94,.15);   color: var(--danger); }

/* ================================================================
   CHARTS
   ================================================================ */
.charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 2rem; }
.chart-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius2); padding: 1.5rem; }
.chart-card.wide { grid-column: span 2; }
.chart-title { font-size: 15px; font-weight: 700; margin-bottom: 1.25rem; display: flex; align-items: center; justify-content: space-between; }
.chart-sub { font-size: 12px; color: var(--white40); font-weight: 400; }
.chart-wrap { position: relative; height: 220px; }
.chart-wrap.tall { height: 280px; }

/* ================================================================
   TABLES
   ================================================================ */
.table-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius2); overflow: hidden; }
.table-header {
  padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
}
.table-title { font-size: 15px; font-weight: 700; }
.search-input {
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 8px; padding: .5rem .9rem; color: var(--white);
  font-family: var(--font); font-size: 13px; outline: none; width: 220px; transition: .2s;
}
.search-input:focus { border-color: var(--blue); width: 260px; }
.search-input::placeholder { color: var(--white40); }
table { width: 100%; border-collapse: collapse; }
thead th {
  padding: .75rem 1.5rem; font-size: 11px; font-weight: 600;
  letter-spacing: .8px; color: var(--white40); text-transform: uppercase;
  text-align: left; border-bottom: 1px solid var(--border);
}
tbody tr { border-bottom: 1px solid rgba(255,255,255,.05); transition: .15s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--white05); }
tbody td { padding: .9rem 1.5rem; font-size: 13.5px; }

/* ================================================================
   FILE ICONS & BADGES
   ================================================================ */
.file-name { display: flex; align-items: center; gap: .75rem; }
.file-icon { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
.file-icon.pdf { background: rgba(244,63,94,.15); color: #fb7185; }
.file-icon.doc { background: rgba(26,108,246,.15); color: var(--blue3); }
.file-icon.img { background: rgba(16,212,142,.15); color: var(--success); }
.file-icon.zip { background: rgba(245,158,11,.15); color: var(--warning); }
.file-icon.txt { background: rgba(255,255,255,.08); color: var(--white60); }
.fname { font-weight: 500; font-size: 13.5px; }
.fsize { font-size: 12px; color: var(--white40); margin-top: 1px; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.badge.active   { background: rgba(16,212,142,.15); color: var(--success); }
.badge.expired  { background: rgba(244,63,94,.15);  color: var(--danger); }
.badge.pending  { background: rgba(245,158,11,.15); color: var(--warning); }
.badge.shared   { background: rgba(26,108,246,.15); color: var(--blue3); }
.badge.encrypted{ background: rgba(0,198,255,.1);   color: var(--cyan); }

.action-btns { display: flex; gap: .5rem; }

/* ================================================================
   UPLOAD ZONE
   ================================================================ */
.upload-zone {
  border: 2px dashed rgba(26,108,246,.4); border-radius: var(--radius2);
  padding: 3rem 2rem; text-align: center; cursor: pointer; transition: .2s;
  background: rgba(26,108,246,.04); position: relative;
}
.upload-zone:hover, .upload-zone.drag { border-color: var(--blue); background: rgba(26,108,246,.08); }
.upload-icon {
  width: 56px; height: 56px; background: rgba(26,108,246,.15);
  border-radius: 16px; margin: 0 auto 1rem;
  display: flex; align-items: center; justify-content: center;
}
.upload-icon svg { width: 28px; height: 28px; fill: none; stroke: var(--blue3); stroke-width: 2; }
.upload-title { font-size: 16px; font-weight: 700; margin-bottom: .5rem; }
.upload-desc { font-size: 13px; color: var(--white60); }
.upload-input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.progress-bar { height: 6px; background: rgba(255,255,255,.1); border-radius: 10px; overflow: hidden; margin: .75rem 0; }
.progress-fill { height: 100%; background: linear-gradient(90deg,#1a6cf6,#00c6ff); border-radius: 10px; transition: width .3s; }

/* ================================================================
   CONFIG SCREEN
   ================================================================ */
.config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
.config-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius2); padding: 1.5rem; }
.config-section-title {
  font-size: 14px; font-weight: 700; margin-bottom: 1.25rem;
  display: flex; align-items: center; gap: .5rem; color: var(--white80);
}
.config-section-title svg { width: 16px; height: 16px; fill: none; stroke: var(--blue3); stroke-width: 2; }
.config-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: .75rem 0; border-bottom: 1px solid rgba(255,255,255,.05);
}
.config-row:last-child { border-bottom: none; }
.config-key { font-size: 13px; color: var(--white80); font-weight: 500; }
.config-desc { font-size: 11px; color: var(--white40); margin-top: 2px; }
.toggle { width: 40px; height: 22px; background: rgba(255,255,255,.15); border-radius: 11px; position: relative; cursor: pointer; transition: .2s; flex-shrink: 0; }
.toggle.on { background: var(--blue); }
.toggle::after { content: ''; position: absolute; width: 16px; height: 16px; background: #fff; border-radius: 50%; top: 3px; left: 3px; transition: .2s; }
.toggle.on::after { left: 21px; }
.version-timeline { display: flex; flex-direction: column; gap: .75rem; }
.version-item { display: flex; gap: 1rem; align-items: flex-start; }
.v-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); flex-shrink: 0; margin-top: 4px; }
.v-dot.current { background: var(--success); box-shadow: 0 0 0 4px rgba(16,212,142,.2); }
.v-label { font-size: 13px; font-weight: 600; }
.v-date { font-size: 11px; color: var(--white40); margin-top: 1px; }
.v-changes { font-size: 12px; color: var(--white60); margin-top: 3px; }

/* ================================================================
   REQUIREMENTS MAP
   ================================================================ */
.req-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 1rem; margin-bottom: 2rem; }
.req-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius2); padding: 1.25rem; }
.req-id { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--white40); text-transform: uppercase; margin-bottom: .5rem; }
.req-title { font-size: 14px; font-weight: 600; margin-bottom: .5rem; }
.req-status-bar { height: 5px; background: rgba(255,255,255,.1); border-radius: 10px; overflow: hidden; margin: .75rem 0; }
.req-fill { height: 100%; border-radius: 10px; }
.fill-done    { background: linear-gradient(90deg,#10d48e,#05f0a3); }
.fill-partial { background: linear-gradient(90deg,#f59e0b,#fcd34d); }
.fill-todo    { background: linear-gradient(90deg,#f43f5e,#fb7185); }
.req-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--white40); }

/* ================================================================
   ADMIN SCREEN
   ================================================================ */
.admin-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 1rem; margin-bottom: 2rem; }
.stat-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius2); padding: 1.25rem;
  display: flex; align-items: center; gap: 1rem;
}
.stat-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.stat-icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }
.stat-icon.blue   { background: rgba(26,108,246,.15); color: var(--blue3); }
.stat-icon.green  { background: rgba(16,212,142,.15); color: var(--success); }
.stat-icon.orange { background: rgba(245,158,11,.15); color: var(--warning); }
.stat-num { font-size: 26px; font-weight: 800; letter-spacing: -.5px; line-height: 1; }
.stat-lbl { font-size: 12px; color: var(--white60); margin-top: 2px; }

/* ================================================================
   SUBSCRIPTION SECTION
   ================================================================ */
.plans-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 1.25rem; margin-bottom: 2rem; }

.plan-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius2); padding: 2rem 1.5rem;
  display: flex; flex-direction: column; transition: .25s; position: relative; overflow: hidden;
}
.plan-card:hover { border-color: var(--border2); transform: translateY(-3px); box-shadow: 0 16px 48px rgba(0,0,0,.3); }
.plan-card.featured {
  border-color: rgba(26,108,246,.5);
  background: rgba(26,108,246,.08);
  box-shadow: 0 0 0 1px rgba(26,108,246,.3), 0 16px 48px rgba(26,108,246,.15);
}
.plan-card.featured::before {
  content: 'MOST POPULAR';
  position: absolute; top: 14px; right: -28px;
  background: linear-gradient(90deg,#1a6cf6,#00c6ff);
  color: #fff; font-size: 9px; font-weight: 800; letter-spacing: 1.5px;
  padding: 5px 40px; transform: rotate(35deg);
}
.plan-badge { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--white40); margin-bottom: .75rem; }
.plan-name  { font-size: 22px; font-weight: 800; margin-bottom: .5rem; }
.plan-price { display: flex; align-items: baseline; gap: .35rem; margin-bottom: 1.5rem; }
.plan-amount { font-size: 40px; font-weight: 900; letter-spacing: -2px; }
.plan-period { font-size: 13px; color: var(--white60); }
.plan-divider { height: 1px; background: var(--border); margin-bottom: 1.5rem; }
.plan-features { list-style: none; display: flex; flex-direction: column; gap: .75rem; flex: 1; margin-bottom: 1.75rem; }
.plan-features li { display: flex; align-items: center; gap: .65rem; font-size: 13.5px; color: var(--white80); }
.plan-features li svg { width: 15px; height: 15px; flex-shrink: 0; fill: none; stroke: var(--success); stroke-width: 2.5; }
.plan-features li.na { color: var(--white40); }
.plan-features li.na svg { stroke: var(--white40); }
.plan-btn { width: 100%; padding: .85rem; border-radius: 10px; font-family: var(--font); font-size: 14px; font-weight: 700; cursor: pointer; border: none; transition: .2s; }
.plan-btn.outline { background: transparent; border: 1px solid var(--border2); color: var(--white80); }
.plan-btn.outline:hover { border-color: var(--blue); color: var(--blue3); background: rgba(26,108,246,.08); }
.plan-btn.solid { background: linear-gradient(135deg,#1a6cf6,#0099e6); color: #fff; }
.plan-btn.solid:hover { box-shadow: 0 8px 28px rgba(26,108,246,.4); transform: translateY(-1px); }

/* Usage meter in current plan card */
.usage-meter-wrap { margin-bottom: 1.5rem; }
.usage-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--white60); margin-bottom: .4rem; }
.usage-bar { height: 6px; background: rgba(255,255,255,.1); border-radius: 10px; overflow: hidden; }
.usage-fill { height: 100%; border-radius: 10px; background: linear-gradient(90deg,#1a6cf6,#00c6ff); }

/* Billing table */
.billing-table th, .billing-table td { font-size: 13px; }
.billing-table .amount { font-family: var(--mono); color: var(--white80); }
.billing-table .status-paid   { color: var(--success); }
.billing-table .status-pending{ color: var(--warning); }

/* Auth toggle link */
.auth-toggle { text-align: center; margin-top: 1.5rem; font-size: 13px; color: var(--white60); }
.auth-toggle a { color: var(--cyan); cursor: pointer; text-decoration: none; font-weight: 500; }
.auth-toggle a:hover { text-decoration: underline; }

/* ================================================================
   MODAL
   ================================================================ */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.7);
  z-index: 200; display: flex; align-items: center; justify-content: center; padding: 2rem;
}
.modal {
  background: #061525; border: 1px solid var(--border2);
  border-radius: var(--radius2); width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
}
.modal-header { padding: 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-size: 17px; font-weight: 700; }
.modal-close { width: 32px; height: 32px; background: var(--card2); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--white60); border: none; }
.modal-close:hover { color: var(--white); background: var(--card); }
.modal-close svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }
.modal-body { padding: 1.5rem; }
.modal-footer { padding: 1.25rem 1.5rem; border-top: 1px solid var(--border); display: flex; gap: .75rem; justify-content: flex-end; }

/* ================================================================
   NOTIFICATION
   ================================================================ */
.notif {
  position: fixed; bottom: 2rem; right: 2rem;
  background: #061525; border: 1px solid var(--success); border-radius: 12px;
  padding: 1rem 1.25rem; display: flex; align-items: center; gap: .75rem;
  font-size: 13.5px; font-weight: 500; z-index: 300;
  animation: notif-in .3s ease; box-shadow: 0 8px 32px rgba(0,0,0,.5);
}
.notif svg { width: 18px; height: 18px; fill: none; stroke: var(--success); stroke-width: 2; }
@keyframes notif-in { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ================================================================
   MISC COMPONENTS
   ================================================================ */
.tabs { display: flex; gap: .5rem; margin-bottom: 1.5rem; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 4px; width: fit-content; }
.tab { padding: .5rem 1.1rem; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--white60); transition: .15s; }
.tab.active { background: rgba(26,108,246,.2); color: var(--blue3); font-weight: 600; }
.tab:hover:not(.active) { color: var(--white); background: var(--white05); }

.online-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); display: inline-block; margin-right: 6px; box-shadow: 0 0 0 3px rgba(16,212,142,.2); }

.enc-badge { display: inline-flex; align-items: center; gap: 5px; background: rgba(0,198,255,.08); border: 1px solid rgba(0,198,255,.2); border-radius: 20px; padding: 3px 10px; font-size: 11px; color: var(--cyan); font-weight: 600; }
.enc-badge svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; }

.link-box { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: .75rem 1rem; font-family: var(--mono); font-size: 12px; color: var(--cyan); display: flex; align-items: center; justify-content: space-between; gap: .5rem; word-break: break-all; margin-top: .75rem; }

.expiry { font-size: 11px; font-family: var(--mono); color: var(--white60); background: rgba(255,255,255,.06); padding: 2px 8px; border-radius: 6px; }

select { background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: .6rem .9rem; color: var(--white); font-family: var(--font); font-size: 13px; outline: none; cursor: pointer; }
select option { background: #061525; }

.bd-legend { display: flex; gap: 1.5rem; margin-bottom: 1rem; font-size: 12px; }
.bd-leg-item { display: flex; align-items: center; gap: .4rem; color: var(--white60); }
.bd-leg-dot { width: 10px; height: 3px; border-radius: 2px; }

/* ================================================================
   RESPONSIVE
   ================================================================ */
@media (max-width: 1100px) { .plans-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 900px) {
  .kpi-grid { grid-template-columns: repeat(2,1fr); }
  .charts-grid { grid-template-columns: 1fr; }
  .chart-card.wide { grid-column: span 1; }
  .config-grid { grid-template-columns: 1fr; }
  .req-grid { grid-template-columns: 1fr 1fr; }
  .plans-grid { grid-template-columns: 1fr; }
}

   File: backend/api.js

   In a real deployment this would be Node.js / Express + Supabase.

/* ── In-memory data store (replaces a database) ─────────────────── */
const DB = {

/* ── Simulated async delay ──────────────────────────────────────── */
function delay(ms = 200) { return new Promise(r => setTimeout(r, ms)); }

/* ── AUTH ENDPOINTS ─────────────────────────────────────────────── */

/**
 * POST /api/auth/login
 * @param {{ email: string, password: string }} body
 * @returns {{ ok: boolean, user?: object, error?: string }}
 */
async function login({ email, password }) {
  await delay();
  if (!email || !password) return { ok: false, error: 'Missing credentials' };
  const user = DB.users.find(u => u.email === email) || DB.users[0];
  return { ok: true, user: { ...user } };
}

/**
 * POST /api/auth/register
 * @param {{ name: string, email: string, password: string }} body
 * @returns {{ ok: boolean, user?: object, error?: string }}
 */
async function register({ name, email, password }) {
  await delay();
  if (!email || !password) return { ok: false, error: 'Missing fields' };
  if (DB.users.find(u => u.email === email)) return { ok: false, error: 'Email already registered' };
  const newUser = { id: Date.now(), name: name || 'New User', email, role: 'User', status: 'active', files: 0, joined: new Date().toISOString().slice(0,10), plan: 'free' };
  DB.users.push(newUser);
  return { ok: true, user: { ...newUser } };
}

/* ── FILE ENDPOINTS ─────────────────────────────────────────────── */

/** GET /api/files — list all files */
async function getFiles() {
  await delay(100);
  return { ok: true, files: [...DB.files] };
}

/** POST /api/files — upload a file record */
async function uploadFile({ name, size, type, encrypted, expiry, owner }) {
  await delay(300);
  const rec = {
    id: Date.now(), name, type: type || name.split('.').pop(),
    size: typeof size === 'number' ? (size / 1048576).toFixed(1) + ' MB' : size,
    owner, status: 'active', encrypted: !!encrypted,
    downloads: 0, expiry: expiry || '2025-12-31',
    uploadedAt: new Date().toISOString().slice(0,10),
    link: 'https://ss.io/s/' + Math.random().toString(36).slice(2,9),
  };
  DB.files.unshift(rec);
  return { ok: true, file: rec };
}

/** DELETE /api/files/:id */
async function deleteFile(id) {
  await delay(150);
  const idx = DB.files.findIndex(f => f.id === id);
  if (idx === -1) return { ok: false, error: 'Not found' };
  DB.files.splice(idx, 1);
  return { ok: true };
}

/** POST /api/files/:id/download */
async function downloadFile(id) {
  await delay(400);
  const f = DB.files.find(f => f.id === id);
  if (!f) return { ok: false, error: 'Not found' };
  f.downloads++;
  return { ok: true, downloads: f.downloads };
}

/* ── USER ENDPOINTS ─────────────────────────────────────────────── */

/** GET /api/users */
async function getUsers() {
  await delay(100);
  return { ok: true, users: [...DB.users] };
}

/** POST /api/users */
async function addUser({ name, email, role }) {
  await delay(200);
  const u = { id: Date.now(), name, email, role, status: 'active', files: 0, joined: new Date().toISOString().slice(0,10), plan: 'free' };
  DB.users.push(u);
  return { ok: true, user: u };
}

/** DELETE /api/users/:id */
async function deleteUser(id) {
  await delay(150);
  DB.users = DB.users.filter(u => u.id !== id);
  return { ok: true };
}

/* ── CONFIG ENDPOINTS ───────────────────────────────────────────── */

/** GET /api/config */
async function getConfig() { await delay(50); return { ok: true, configs: { ...DB.configs } }; }

/** PATCH /api/config */
async function patchConfig(key, value) {
  await delay(50);
  if (!(key in DB.configs)) return { ok: false, error: 'Unknown config key' };
  DB.configs[key] = value;
  return { ok: true, configs: { ...DB.configs } };
}

/* ── SUBSCRIPTION ENDPOINTS ─────────────────────────────────────── */

/** GET /api/plans */
async function getPlans() { await delay(80); return { ok: true, plans: DB.plans }; }

/** POST /api/subscriptions/upgrade */
async function upgradePlan({ userId, planId }) {
  await delay(500);
  const user = DB.users.find(u => u.id === userId);
  if (!user) return { ok: false, error: 'User not found' };
  const plan = DB.plans.find(p => p.id === planId);
  if (!plan) return { ok: false, error: 'Plan not found' };
  user.plan = planId;
  return { ok: true, plan };
}

/** GET /api/billing */
async function getBilling() { await delay(100); return { ok: true, invoices: DB.billing }; }

/* ── Export API surface (mirrors fetch() response shape) ────────── */
window.API = {
  auth:  { login, register },
  files: { list: getFiles, upload: uploadFile, delete: deleteFile, download: downloadFile },
  users: { list: getUsers, add: addUser, delete: deleteUser },
  config:{ get: getConfig, patch: patchConfig },
  plans: { list: getPlans, upgrade: upgradePlan, billing: getBilling },
};

console.info('[SecureShare API] Simulated backend loaded. Access via window.API');

  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < 60; i++) {
    particles.push({
      x:  Math.random() * canvas.width,
      y:  Math.random() * canvas.height,
      r:  Math.random() * 2 + .5,
      vx: (Math.random() - .5) * .4,
      vy: (Math.random() - .5) * .4,
      o:  Math.random() * .6 + .1,
    });
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    /* Grid */
    ctx.strokeStyle = 'rgba(26,108,246,0.05)';
    ctx.lineWidth = 1;
    const gs = 60;
    for (let x = 0; x < canvas.width; x += gs) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
    for (let y = 0; y < canvas.height; y += gs) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

    /* Glow orbs */
    const g1 = ctx.createRadialGradient(canvas.width*.2, canvas.height*.3, 0, canvas.width*.2, canvas.height*.3, 400);
    g1.addColorStop(0,'rgba(26,108,246,0.12)'); g1.addColorStop(1,'transparent');
    ctx.fillStyle = g1; ctx.fillRect(0,0,canvas.width,canvas.height);

    const g2 = ctx.createRadialGradient(canvas.width*.8, canvas.height*.7, 0, canvas.width*.8, canvas.height*.7, 300);
    g2.addColorStop(0,'rgba(0,198,255,0.08)'); g2.addColorStop(1,'transparent');
    ctx.fillStyle = g2; ctx.fillRect(0,0,canvas.width,canvas.height);

    /* Particles */
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > canvas.width)  p.vx *= -1;
      if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(26,108,246,${p.o})`; ctx.fill();
    });

    /* Connection lines */
    for (let i = 0; i < particles.length; i++) {
      for (let j = i+1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const d  = Math.sqrt(dx*dx + dy*dy);
        if (d < 100) {
          ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(26,108,246,${.1*(1-d/100)})`; ctx.lineWidth = .5; ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

function wireFileActions() {
  document.querySelectorAll('.file-action').forEach(btn => {
    btn.onclick = async () => {
      const id     = +btn.dataset.id;

      const file   = store.files.find(f => f.id === id);
      if (action === 'delete') {
        if (!confirm('Delete ' + file.name + '?')) return;
        await API.files.delete(id);
        store.files = store.files.filter(f => f.id !== id);
        notify('File deleted'); render();
      } else if (action === 'share') {
        store.modal = { type:'share', file }; render();
      } else if (action === 'view') {
        notify('Downloading ' + file.name + '…');
        const res = await API.files.download(id);
        if (res.ok) { file.downloads = res.downloads; }
        notify(file.name + ' downloaded');
        render();
      }
    };
  });

        </div>`).join('')}

  zone.ondragover = e => { e.preventDefault(); zone.classList.add('drag'); };

  zone.ondrop = e => { e.preventDefault(); zone.classList.remove('drag'); handleUpload(e.dataTransfer.files[0]); };
  document.getElementById('file-input').onchange = e => handleUpload(e.target.files[0]);
  document.getElementById('enc-toggle').onclick = e => e.currentTarget.classList.toggle('on');
}

async function handleUpload(file) {
  if (!file) return;
  store.uploading = true; store.uploadProgress = 0; render();
  let p = 0;
  const iv = setInterval(async () => {
    p += Math.random() * 8 + 3;
    if (p >= 100) {
      clearInterval(iv);
      store.uploading = false;
      const expiry = document.getElementById('expiry-date')?.value || '2025-12-31';
      const res = await API.files.upload({ name: file.name, size: file.size, encrypted: true, expiry, owner: store.user.name });
      if (res.ok) store.files = (await API.files.list()).files;
      notify('✓ ' + file.name + ' uploaded & encrypted');
      store.page = 'files'; render(); return;
    }
    store.uploadProgress = Math.min(p, 99);
    const fill = document.querySelector('.progress-fill');
    if (fill) fill.style.width = store.uploadProgress + '%';
    const pct = document.querySelector('.progress-fill + span, #up-pct');
    if (pct) pct.textContent = Math.round(store.uploadProgress) + '%';
  }, 80);
}

      type:'line', data:{ labels:['Jan','Feb','Mar','Apr','May','Jun'], datasets:[{ data:[12,24,41,58,71,84], borderColor:'#f59e0b', backgroundColor:'rgba(245,158,11,0.08)', tension:.4, fill:true, pointRadius:3, pointBackgroundColor:'#f59e0b' }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } },
        scales:{ x:{ grid:{ display:false }, ticks:{ color:'rgba(255,255,255,.4)', font:{ size:11 } } },
                 y:{ grid:{ color:'rgba(255,255,255,.05)' }, ticks:{ color:'rgba(255,255,255,.4)', font:{ size:11 } }, callback: v => v+'GB' } } }
    });
  }, 100);
}

/* ================================================================
   PAGE: SUBSCRIPTION  ← NEW
   ================================================================ */
async function renderSubscription(el) {
  el.innerHTML = `<div style="text-align:center;padding:3rem;color:var(--white40)">Loading plans…</div>`;
  const [plansRes, billingRes] = await Promise.all([API.plans.list(), API.plans.billing()]);
  const plans   = plansRes.plans;
  const invoices = billingRes.invoices;
  const currentPlanId = store.user.plan || 'free';
  const currentPlan   = plans.find(p => p.id === currentPlanId);

  const featCheck = (f) => `
  <li>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="15" height="15"><polyline points="20 6 9 17 4 12"/></svg>
    ${f}
  </li>`;
  const featX = (f) => `
  <li class="na">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    ${f}
  </li>`;

  el.innerHTML = `
  <div class="page-header">
    <div>
      <div class="page-title">Subscription &amp; Billing</div>
      <div class="page-sub">Manage your plan, usage, and payment history</div>
    </div>
    <div class="header-actions">
      <span class="enc-badge">${ICONS.star} Current: <strong style="margin-left:4px;text-transform:capitalize">${currentPlanId}</strong></span>
    </div>
  </div>

  <!-- Current Plan Summary -->
  <div class="table-card" style="padding:1.5rem;margin-bottom:1.75rem">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:2rem;align-items:center">
      <div>
        <div style="font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--white40);margin-bottom:.5rem">Your Current Plan</div>
        <div style="font-size:28px;font-weight:900;letter-spacing:-.5px;text-transform:capitalize">${currentPlanId}</div>
        <div style="font-size:13px;color:var(--white60);margin-top:.25rem">${currentPlan ? '$' + currentPlan.price + '/month' : ''} · Renews May 1, 2025</div>
      </div>
      <div>
        <div class="usage-meter-wrap">
          <div class="usage-label"><span>Storage Used</span><span>68.4 GB / ${currentPlan?.storage||'5 GB'}</span></div>
          <div class="usage-bar"><div class="usage-fill" style="width:${currentPlanId==='free'?'80':currentPlanId==='pro'?'68':'12'}%"></div></div>
        </div>
        <div class="usage-meter-wrap">
          <div class="usage-label"><span>Files</span><span>${store.files.length} / ${currentPlan?.maxFiles===-1?'∞':currentPlan?.maxFiles||50}</span></div>
          <div class="usage-bar"><div class="usage-fill" style="width:${currentPlanId==='free'?'10':currentPlanId==='pro'?'0.1':'0.05'}%;background:linear-gradient(90deg,#10d48e,#05f0a3)"></div></div>
        </div>
      </div>
      <div style="text-align:right">
        <button class="btn btn-ghost" onclick="notify('Invoice downloaded!')" style="margin-bottom:.5rem">${ICONS.download} Download Invoice</button><br/>
        <button class="btn btn-danger btn-sm" onclick="if(confirm('Cancel subscription?'))notify('Subscription cancelled')">Cancel Subscription</button>
      </div>
    </div>
  </div>

  <!-- Plan Cards -->
  <div style="font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--white40);margin-bottom:1rem">Available Plans</div>
  <div class="plans-grid">
    ${plans.map(p => `
    <div class="plan-card ${p.id==='pro'?'featured':''}">
      <div class="plan-badge">${p.id==='free'?'STARTER':p.id==='pro'?'PROFESSIONAL':'ENTERPRISE'}</div>
      <div class="plan-name" style="color:${p.id==='free'?'var(--white)':p.id==='pro'?'var(--blue3)':'var(--cyan)'}">${p.name}</div>
      <div class="plan-price">
        <span class="plan-amount">$${p.price}</span>
        <span class="plan-period">${p.period}</span>
      </div>
      <div class="plan-divider"></div>
      <ul class="plan-features">
        ${p.features.map(featCheck).join('')}
        ${p.missing.map(featX).join('')}
      </ul>
      ${p.id === currentPlanId
        ? `<button class="plan-btn outline" disabled style="opacity:.5;cursor:default">Current Plan</button>`
        : `<button class="plan-btn ${p.id==='enterprise'?'outline':'solid'} upgrade-btn" data-plan="${p.id}">
             ${p.price === 0 ? 'Downgrade' : 'Upgrade to ' + p.name}
           </button>`
      }
    </div>`).join('')}
  </div>

  <!-- Billing History -->
  <div class="table-card" style="margin-top:1.75rem">
    <div class="table-header">
      <div class="table-title">${ICONS.credit} Billing History</div>
      <button class="btn btn-ghost btn-sm" onclick="notify('Exporting…')">${ICONS.download} Export CSV</button>
    </div>
    <table class="billing-table">
      <thead><tr><th>Invoice</th><th>Date</th><th>Plan</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead>
      <tbody>
        ${invoices.map(inv => `<tr>
          <td style="font-family:var(--mono);font-size:12px;color:var(--white60)">${inv.id}</td>
          <td style="font-size:13px">${inv.date}</td>
          <td><span class="badge shared">${inv.plan}</span></td>
          <td class="amount">${inv.amount}</td>
          <td><span class="status-${inv.status}" style="font-size:12px;font-weight:600;text-transform:capitalize">${inv.status}</span></td>
          <td><button class="btn btn-ghost btn-sm" onclick="notify('Downloading ${inv.id}…')">${ICONS.download}</button></td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>

  <!-- Payment Method -->
  <div class="table-card" style="margin-top:1.25rem;padding:1.5rem">
    <div class="config-section-title">${ICONS.credit} Payment Method</div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:.75rem;background:var(--card2);border:1px solid var(--border);border-radius:12px">
      <div style="display:flex;align-items:center;gap:1rem">
        <div style="background:rgba(26,108,246,.15);border-radius:8px;padding:.5rem .75rem;font-size:12px;font-weight:700;font-family:var(--mono);color:var(--blue3)">VISA</div>
        <div>
          <div style="font-size:13px;font-weight:600">•••• •••• •••• 4242</div>
          <div style="font-size:11px;color:var(--white40)">Expires 08/2027</div>
        </div>
      </div>
      <div style="display:flex;gap:.75rem">
        <button class="btn btn-ghost btn-sm" onclick="store.modal={type:'payment'};render()">Update Card</button>
        <span class="badge active">Default</span>
      </div>
    </div>
  </div>`;

  /* Wire upgrade buttons */
  document.querySelectorAll('.upgrade-btn').forEach(b => {
    b.onclick = async () => {
      const planId = b.dataset.plan;
      const plan   = plans.find(p => p.id === planId);
      if (!confirm(`Upgrade to ${plan.name} ($${plan.price}/mo)?`)) return;
      b.textContent = 'Processing…'; b.disabled = true;
      const res = await API.plans.upgrade({ userId: store.user.id, planId });
      if (res.ok) {
        store.user.plan = planId;
        notify(`✓ Upgraded to ${plan.name}!`);
        renderSubscription(el);
      } else {
        notify('Upgrade failed', 'warning');
        b.disabled = false;
      }
    };
  });
}

/* ================================================================
   MODALS
   ================================================================ */
function buildModal() {
  const m = store.modal;

  if (m.type === 'share') {
    const f = m.file;
    return `<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header"><div class="modal-title">Share File</div><button class="modal-close" id="modal-close">${ICONS.x}</button></div>
      <div class="modal-body">
        <div style="margin-bottom:1.25rem">
          <div class="config-key" style="margin-bottom:.5rem">File</div>
          <div style="background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem;display:flex;align-items:center;gap:.75rem">
            <div class="file-icon pdf" style="width:32px;height:32px;font-size:10px">${f.type.toUpperCase()}</div>
            <div><div style="font-weight:500;font-size:13px">${f.name}</div><div style="font-size:11px;color:var(--white40)">${f.size} · ${f.encrypted?'AES-256 Encrypted':'Unencrypted'}</div></div>
          </div>
        </div>
        <div class="config-row" style="padding-bottom:1rem">
          <div><div class="config-key">Expiry Date</div></div>
          <input class="form-input" type="date" value="${f.expiry}" style="width:180px"/>
        </div>
        <div class="config-row" style="padding-bottom:1rem">
          <div><div class="config-key">Access Level</div></div>
          <select><option>Link Only</option><option>Specific Email</option><option>Password Protected</option></select>
        </div>
        <div>
          <div class="config-key" style="margin-bottom:.5rem">Secure Share Link</div>
          <div class="link-box">${f.link}<button class="btn btn-ghost btn-sm" style="flex-shrink:0" onclick="notify('Link copied!')">${ICONS.copy}</button></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="modal-close2">Cancel</button>
        <button class="btn btn-blue" onclick="notify('Secure link sent!');store.modal=null;render()">Send Link</button>
      </div>
    </div></div>`;
  }

  if (m.type === 'adduser') {
    return `<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header"><div class="modal-title">Add New User</div><button class="modal-close" id="modal-close">${ICONS.x}</button></div>
      <div class="modal-body">
        <div class="form-group"><label class="form-label">Full Name</label><input class="form-input" type="text" id="new-name" placeholder="Full name"/></div>
        <div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" id="new-email" placeholder="user@company.com"/></div>
        <div class="form-group"><label class="form-label">Role</label><select id="new-role" style="width:100%"><option>User</option><option>Manager</option><option>Admin</option></select></div>
        <div class="form-group"><label class="form-label">Plan</label><select id="new-plan" style="width:100%"><option value="free">Free</option><option value="pro">Pro</option><option value="enterprise">Enterprise</option></select></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="modal-close2">Cancel</button>
        <button class="btn btn-blue" id="save-user">Add User</button>
      </div>
    </div></div>`;
  }

  if (m.type === 'payment') {
    return `<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header"><div class="modal-title">Update Payment Method</div><button class="modal-close" id="modal-close">${ICONS.x}</button></div>
      <div class="modal-body">
        <div class="form-group"><label class="form-label">Card Number</label><input class="form-input" type="text" placeholder="1234 5678 9012 3456" maxlength="19"/></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
          <div class="form-group"><label class="form-label">Expiry</label><input class="form-input" type="text" placeholder="MM/YY" maxlength="5"/></div>
          <div class="form-group"><label class="form-label">CVC</label><input class="form-input" type="text" placeholder="123" maxlength="3"/></div>
        </div>
        <div class="form-group"><label class="form-label">Name on Card</label><input class="form-input" type="text" placeholder="Layla Hassan"/></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="modal-close2">Cancel</button>
        <button class="btn btn-blue" onclick="notify('Payment method updated!');store.modal=null;render()">Save Card</button>
      </div>
    </div></div>`;
  }
  return '';
}

function wireModal() {
  ['modal-close','modal-close2','modal-overlay'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.onclick = (e) => { if (id !== 'modal-overlay' || e.target === el) { store.modal = null; render(); } };
  });
  const saveUser = document.getElementById('save-user');
  if (saveUser) saveUser.onclick = async () => {
    const name  = document.getElementById('new-name').value  || 'New User';
    const email = document.getElementById('new-email').value || 'user@secureshare.io';
    const role  = document.getElementById('new-role').value;
    const res   = await API.users.add({ name, email, role });
    if (res.ok) {
      store.users.push(res.user);
      store.modal = null;
      notify('User added successfully');
      render();
    }
  };
}

/* ================================================================
   BOOT
   ================================================================ */
render();

  </script>
</body>
